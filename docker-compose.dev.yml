# Development setup: Backend + Database (frontend runs locally via Vite)
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: radar_db
    environment:
      POSTGRES_USER: ${DB_USER:-radar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-radar_buy_nothing}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-radar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server (TypeScript watch mode)
  api:
    image: node:24-alpine
    container_name: buy_nothing_api_dev
    working_dir: /app
    command: >
      sh -c "npm install -D tsx &&
             npx tsx watch src/server/index.ts"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-radar_buy_nothing}
      DB_USER: ${DB_USER:-radar}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
